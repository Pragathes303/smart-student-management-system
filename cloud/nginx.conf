server {
    listen 80;
    server_name _;

    # Client body size limit for student photo uploads (matches Flask 3MB limit)
    client_max_body_size 5M;

    # Serve static assets directly through Nginx for maximum performance
    location /static/ {
        alias /var/www/student_system/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy to Gunicorn WSGI server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Prometheus Metrics endpoint security (allow/deny IP restriction example)
    location = /metrics {
        # Uncomment and configure to allow only internal Prometheus scrapers:
        # allow 10.0.0.0/16;       # Allow VPC / internal subnet
        # allow 127.0.0.1;         # Allow local monitoring
        # deny all;                # Deny all other external IPs

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security: Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ \.db$ {
        deny all;
    }
}
